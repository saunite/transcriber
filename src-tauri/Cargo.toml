[package]
name = "transcriber-gui"
version = "0.1.1"
edition = "2021"
license = "GPL-2.0-or-later"

# UNVERIFIED: written without a working Rust/Cargo toolchain on this machine
# (blocked by machine-level execution policy, not admin rights -- see
# openspec/changes/add-tauri-gui/design.md). Treat as a first draft to
# `cargo build` and iterate on wherever Rust is actually usable.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Manual update check only (openspec/changes/add-manual-update-check): rustls
# TLS, verified against the OS trust store so installed corporate CAs work.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"

# Linux only: remove tao's Wayland header bar so the desktop draws the frame, and
# name the window Transcriber so it matches Transcriber.desktop
# (openspec/changes/fix-linux-native-window-frame). Same version tao already uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
