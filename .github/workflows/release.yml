# Release pipeline (openspec/changes/01-add-release-pipeline).
#
#   push tag vX.Y.Z  -> preflight (version + provenance checks, draft release)
#                       -> platform legs build, smoke-test, package, upload to the draft
#   workflow_dispatch -> same legs, no release; outputs are run artifacts
#
# The release stays a draft until a maintainer publishes it by hand.
# ponytail: no Rust/pip/model caching -- releases are rare and a cold leg costs
# minutes, not money. Add Swatinem/rust-cache + actions/cache if waiting hurts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Same minor as the `tauri` crate in src-tauri/Cargo.lock.
  TAURI_CLI_VERSION: "2.11.4"
  PYTHON_VERSION: "3.14"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches app version
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$want" != "$conf" ] || [ "$want" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $want) does not match tauri.conf.json ($conf) / Cargo.toml ($cargo)"
            exit 1
          fi

      # Automates the licensing check in docs/building.md, "Releasing": these links are the GPL
      # source-availability mechanism, so a dead one blocks the release.
      # Templated URLs ({platform}) are skipped; their tag-tree URL is checked.
      # SOURCE-PROVENANCE.txt names one exact PyAV build (its bundled GPL FFmpeg,
      # x264, x265). Unpinned, every build took the newest PyAV and the file went
      # stale silently, so every run -- manual too -- checks the pin matches it
      # (openspec/changes/refresh-source-provenance-for-pyav).
      - name: PyAV pin matches source provenance
        run: |
          fail=0
          want=""
          for f in requirements.txt requirements-linux.txt requirements-macos.txt; do
            lines=$(grep -E '^av([^A-Za-z0-9_-]|$)' "$f" || true)
            v=$(printf '%s\n' "$lines" | sed -nE 's/^av==([0-9][0-9A-Za-z.+-]*)$/\1/p')
            if [ -z "$v" ] || [ "$(printf '%s\n' "$lines" | grep -c .)" != 1 ]; then
              echo "::error::$f must pin PyAV to one exact version (av==<version>); found: ${lines:-no av line}"
              fail=1
              continue
            fi
            echo "$f: av==$v"
            if [ -z "$want" ]; then
              want=$v
              first=$f
            elif [ "$v" != "$want" ]; then
              echo "::error::$f pins av==$v but $first pins av==$want"
              fail=1
            fi
          done
          recorded=$(sed -nE 's/.*[[:space:]]av == ([0-9][^[:space:]]*).*/\1/p' SOURCE-PROVENANCE.txt | head -n 1)
          if [ -n "$want" ] && [ "$recorded" != "$want" ]; then
            echo "::error::requirements pin av==$want but SOURCE-PROVENANCE.txt records av == ${recorded:-nothing}; re-derive SOURCE-PROVENANCE.txt for this PyAV"
            fail=1
          fi
          exit $fail

      - name: Source-provenance links resolve
        run: |
          fail=0
          for url in $(grep -oE 'https?://[^ )>"]+' SOURCE-PROVENANCE.txt | grep -v '{' | sort -u); do
            if ! curl -fsSL --retry 2 -r 0-0 -o /dev/null "$url"; then
              echo "::error::Source location does not resolve: $url"
              fail=1
            fi
          done
          exit $fail

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # The GPL source directions go in the notes, linked at this tag so they
        # always match what this release bundled, rather than as a download
        # among the packages (openspec/changes/tidy-release-workflow). The same
        # file also ships inside every artifact.
        run: |
          notes=$(cat <<EOF
          ## Source code for bundled GPL components

          These downloads include FFmpeg, x264 and x265 (GPL-licensed) through PyAV.
          Where to get their exact source: [SOURCE-PROVENANCE.txt](https://github.com/$REPO/blob/$GITHUB_REF_NAME/SOURCE-PROVENANCE.txt).
          The same file is also inside every download.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes

  linux:
    needs: preflight
    # glibc 2.35 baseline: covers Debian 12, openSUSE Leap 15.6+, current
    # Fedora/Tumbleweed (design.md Decision 2).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: System packages
        # libportaudio2: PyInstaller's sounddevice hook bundles PortAudio only
        # if it can find it at freeze time. libfuse2: runs linuxdeploy's AppImage.
        # squashfs-tools: build_portable.py repacks the AppImage without the
        # host-owned libwayland libraries (fix-appimage-egl-crash).
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libportaudio2 libfuse2 squashfs-tools

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-linux.txt

      - name: Freeze sidecar and stage resources
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-linux.txt pyinstaller
          .venv/bin/python build_sidecar.py
          mkdir -p src-tauri/binaries
          cp dist/linux/transcriber-sidecar src-tauri/binaries/transcriber-sidecar-x86_64-unknown-linux-gnu
          .venv/bin/python fetch_sidecar_resources.py

      - name: Smoke-test the frozen sidecar
        run: bash .github/smoke-test.sh dist/linux/transcriber-sidecar

      # Caches ~/.cargo and src-tauri/target, keyed on Cargo.lock + toolchain,
      # so only this project's own crate recompiles on a hit
      # (openspec/changes/speed-up-release-workflow).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build GUI packages
        working-directory: src-tauri
        # NO_STRIP: linuxdeploy's bundled strip can't parse .relr.dyn sections
        # (docs/building.md, Linux build); harmless where it isn't needed.
        run: NO_STRIP=1 npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --bundles appimage,deb,rpm

      # Tauri ships every packaged file as an ordinary one, so the repository
      # definition under /etc would be overwritten on each upgrade, taking a
      # user's "I disabled this" edit with it. This marks it as a config file
      # for dpkg and rpm (openspec/changes/add-linux-package-repos).
      - name: Mark the repository file as configuration
        run: .venv/bin/python mark_package_configs.py

      - name: Assemble portable + CLI artifacts
        run: |
          .venv/bin/python build_portable.py
          mkdir -p out
          cp dist/portable/*.AppImage dist/portable/transcriber-cli_*.tar.gz \
             src-tauri/target/release/bundle/deb/*.deb \
             src-tauri/target/release/bundle/rpm/*.rpm out/
          # Lowercase the .deb and .rpm file names, to match the package they
          # install (`transcriber`); Tauri derives them from productName
          # ("Transcriber"). The AppImage installs nothing and keeps the
          # capitalised name (openspec/changes/fix-linux-native-window-frame).
          for f in out/Transcriber*.deb out/Transcriber*.rpm; do mv "$f" "out/transcriber${f#out/Transcriber}"; done
          ls -la out

      # Only that the package manager resolves the dependencies and installs;
      # GUI launch is checked by hand (design.md Decision 8).
      # Only that the package manager resolves the dependencies and installs;
      # GUI launch is checked by hand (01's design.md Decision 8). The five
      # checks are independent, so they run concurrently against the packages
      # already in out/ -- sequential runs cost 3m27s
      # (openspec/changes/speed-up-release-workflow). Each writes its own log so
      # a failure still names the distro that refused the package; sh -c
      # everywhere, because the /p/*.rpm glob must expand inside the container.
      - name: Install checks on target distros
        run: |
          set -u
          declare -A CHECK=(
            ["debian:stable"]='apt-get update -qq && apt-get install -y -qq /p/*.deb'
            ["ubuntu:24.04"]='apt-get update -qq && apt-get install -y -qq /p/*.deb'
            ["fedora:latest"]='dnf install -y /p/*.rpm'
            ["opensuse/leap:latest"]='zypper --non-interactive install --allow-unsigned-rpm /p/*.rpm'
            ["opensuse/tumbleweed"]='zypper --non-interactive install --allow-unsigned-rpm /p/*.rpm'
          )
          started=()
          for img in "${!CHECK[@]}"; do
            log="check-$(echo "$img" | tr '/:' '__').log"
            docker run --rm -v "$PWD/out:/p" -e DEBIAN_FRONTEND=noninteractive "$img" \
              sh -c "${CHECK[$img]}" > "$log" 2>&1 &
            started+=("$!|$img|$log")
          done
          failed=0
          for entry in "${started[@]}"; do
            pid="${entry%%|*}"; rest="${entry#*|}"; img="${rest%%|*}"; log="${rest##*|}"
            if wait "$pid"; then
              echo "::group::$img passed"
              tail -5 "$log"
              echo "::endgroup::"
            else
              failed=1
              echo "::error::install check failed on $img"
              echo "::group::$img FAILED"
              cat "$log"
              echo "::endgroup::"
            fi
          done
          exit "$failed"

      - name: Upload to draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Upload run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*

  windows:
    needs: preflight
    # Native Windows runner, but the GNU toolchain: the host toolchain matters
    # too, or build scripts and proc-macros would still be linked by MSVC
    # (openspec/changes/02-add-release-pipeline-windows, design.md Decision 1).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: GNU Rust toolchain and mingw-w64
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu
          # The runner image ships mingw; put it on PATH under the linker name
          # src-tauri/.cargo/config.toml expects (x86_64-w64-mingw32-gcc).
          echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"
          echo "C:\\mingw64\\bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        shell: bash
        run: |
          rustc -vV
          x86_64-w64-mingw32-gcc --version

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Freeze sidecar and stage resources
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/pip install -r requirements.txt pyinstaller
          .venv/Scripts/python build_sidecar.py
          mkdir -p src-tauri/binaries
          cp dist/windows/transcriber-sidecar.exe src-tauri/binaries/transcriber-sidecar-x86_64-pc-windows-gnu.exe
          .venv/Scripts/python fetch_sidecar_resources.py

      - name: Smoke-test the frozen sidecar
        shell: bash
        run: bash .github/smoke-test.sh dist/windows/transcriber-sidecar.exe

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build GUI packages
        working-directory: src-tauri
        shell: bash
        run: npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --target x86_64-pc-windows-gnu --bundles nsis

      - name: Assemble portable + CLI artifacts
        shell: bash
        run: |
          .venv/Scripts/python build_portable.py --target x86_64-pc-windows-gnu
          mkdir -p out
          cp dist/portable/Transcriber_*_windows-x64.zip \
             dist/portable/transcriber-cli_*_windows-x64.zip \
             src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe out/
          ls -la out

      - name: Upload to draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Upload run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  macos:
    needs: preflight
    # Apple Silicon only, ad-hoc signed, untested on real hardware: no Mac is
    # available (openspec/changes/03-add-release-pipeline-macos).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-macos.txt

      - name: Build the audio-tap helper
        # The universal swift build needs full Xcode, which the runners ship
        # (design.md Context). build_sidecar.py refuses to freeze without it.
        run: bash macos/audiotap-helper/build.sh

      - name: Freeze sidecar and stage resources
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-macos.txt pyinstaller
          .venv/bin/python build_sidecar.py
          mkdir -p src-tauri/binaries
          cp dist/darwin/transcriber-sidecar src-tauri/binaries/transcriber-sidecar-aarch64-apple-darwin
          .venv/bin/python fetch_sidecar_resources.py

      - name: Helper is bundled in the sidecar
        # macos_capture resolves the helper at macos/audiotap-helper/ inside the
        # extraction directory; a freeze without it is the gap this job closes.
        run: |
          .venv/bin/pyi-archive_viewer -l dist/darwin/transcriber-sidecar > sidecar-archive.txt
          grep -F "'macos/audiotap-helper/audiotap-helper'" sidecar-archive.txt \
            || { echo "::error::macos/audiotap-helper/audiotap-helper is not inside the frozen sidecar"; exit 1; }

      - name: CLI binary signature
        # Recorded, not asserted: PyInstaller ad-hoc signs its output on macOS,
        # and the smoke test below cannot execute an unsigned arm64 binary.
        run: codesign -dv dist/darwin/transcriber-sidecar 2>&1 || true

      - name: Smoke-test the frozen sidecar
        run: bash .github/smoke-test.sh dist/darwin/transcriber-sidecar

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build GUI packages
        working-directory: src-tauri
        run: npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --bundles app,dmg

      - name: Verify the disk image
        run: hdiutil verify src-tauri/target/release/bundle/dmg/*.dmg

      - name: Assemble portable + CLI artifacts
        run: |
          .venv/bin/python build_portable.py
          # build_macos copies the licence notices into the already-signed .app.
          # Prove the ad-hoc signature still verifies before the zip ships it:
          # an invalid signature on Apple Silicon shows as "damaged", with no
          # Open Anyway path.
          codesign -dv src-tauri/target/release/bundle/macos/Transcriber.app 2>&1
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Transcriber.app
          # Unzipping must produce Transcriber.app itself, not its loose Contents/.
          unzip -l dist/portable/Transcriber_*_macos-arm64.zip | grep -q " Transcriber.app/Contents/Info.plist$" \
            || { echo "::error::the zipped app does not unpack to Transcriber.app"; exit 1; }
          mkdir -p out
          cp src-tauri/target/release/bundle/dmg/*.dmg \
             dist/portable/Transcriber_*_macos-arm64.zip \
             dist/portable/transcriber-cli_*_macos-arm64.tar.gz out/
          ls -la out

      - name: Upload to draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Upload run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*
