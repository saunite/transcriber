name: Build GUI installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "transcriber.py"
      - "transcription_engine.py"
      - "audio_capture.py"
      - "wasapi_capture.py"
      - "macos_capture.py"
      - "build_sidecar.py"
      - "fetch_sidecar_resources.py"
      - ".github/workflows/build-gui.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust-target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri build deps)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pip install -r requirements.txt
          else
            pip install -r requirements-linux.txt
          fi
          pip install pyinstaller

      - name: Freeze sidecar
        run: python build_sidecar.py

      - name: Stage sidecar into Tauri externalBin location
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.os }}" in
            windows-latest)
              src="dist/windows/transcriber-sidecar.exe"
              dest="src-tauri/binaries/transcriber-sidecar-${{ matrix.rust-target }}.exe"
              ;;
            macos-latest)
              src="dist/darwin/transcriber-sidecar"
              dest="src-tauri/binaries/transcriber-sidecar-${{ matrix.rust-target }}"
              ;;
            *)
              src="dist/linux/transcriber-sidecar"
              dest="src-tauri/binaries/transcriber-sidecar-${{ matrix.rust-target }}"
              ;;
          esac
          cp "$src" "$dest"
          chmod +x "$dest" || true

      - name: Stage model resources
        run: python fetch_sidecar_resources.py

      # No ffmpeg staging step: the sidecar decodes audio/video via PyAV
      # (bundled with faster-whisper), not an external ffmpeg binary. See
      # openspec/changes/drop-ffmpeg-dependency/.

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust-target }}

      - name: Assemble portable artifact
        run: python build_portable.py --target ${{ matrix.rust-target }}

      - uses: actions/upload-artifact@v4
        with:
          name: transcriber-gui-${{ matrix.os }}
          path: dist/portable/**
