schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Offline audio and video transcription tool built with Python.
  Uses faster-whisper for transcription, sounddevice and pyaudiowpatch
  (WASAPI loopback) for live audio capture, numpy/scipy for audio
  processing, and ffmpeg for audio extraction.
  Cross-platform: Windows and Linux.
  Supports file transcription and real-time live streaming, saving to
  txt/srt/vtt. Development is managed through the OpenSpec spec-driven
  workflow; every change is tracked as a change proposal.

